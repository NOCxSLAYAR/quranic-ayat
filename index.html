<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayah Noor — Quranic Guidance</title>

<!-- Browser Tab Logo -->
<link
rel="icon"
type="image/svg+xml"
href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23061611'/%3E%3Ctext x='50' y='72' text-anchor='middle' font-size='65' fill='%23e4ce87'%3E☾%3C/text%3E%3C/svg%3E"
>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =====================================================
   BODY
===================================================== */

body{

    min-height:100vh;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    color:#ffffff;

    padding:25px 15px;

    background:

    radial-gradient(
        circle at 10% 10%,
        #164b38,
        transparent 35%
    ),

    radial-gradient(
        circle at 90% 90%,
        #4a3e1b,
        transparent 35%
    ),

    #061611;
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container{

    width:min(920px,95%);

    margin:auto;

}


/* =====================================================
   HERO
===================================================== */

.hero{

    text-align:center;

    padding:
    30px 0
    35px;

}


.moon{

    font-size:60px;

    color:#e4ce87;

    text-shadow:
    0 0 30px
    rgba(228,206,135,.35);

}


.bismillah{

    font-family:
    "Times New Roman",
    serif;

    font-size:29px;

    color:#c4e9ce;

    margin:
    12px 0
    20px;

}


h1{

    font-size:52px;

    margin-bottom:15px;

    letter-spacing:-1px;

}


h1 span{

    color:#9de0b1;

}


.hero p{

    color:#9cafaa;

    line-height:1.8;

    max-width:650px;

    margin:auto;

}


/* =====================================================
   SEARCH AREA
===================================================== */

.search-box{

    padding:14px;

    border-radius:25px;

    background:
    rgba(255,255,255,.065);

    border:
    1px solid
    rgba(255,255,255,.12);

    box-shadow:
    0 20px 60px
    rgba(0,0,0,.2);

    backdrop-filter:
    blur(12px);

}


textarea{

    width:100%;

    height:125px;

    resize:none;

    border:none;

    outline:none;

    background:transparent;

    color:#fff;

    font-size:17px;

    line-height:1.6;

    padding:17px;

}


textarea::placeholder{

    color:#70867d;

}


/* =====================================================
   SEARCH BUTTON
===================================================== */

#searchBtn{

    width:100%;

    padding:16px;

    border:none;

    border-radius:16px;

    text-align: center;

    background:
    linear-gradient(
        135deg,
        #c4ebcd,
        #70c58c
    );

    color:#071b11;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;

}


#searchBtn:hover{

    transform:
    translateY(-2px);

    box-shadow:
    0 12px 30px
    rgba(112,197,140,.2);

}


#searchBtn:disabled{

    opacity:.6;

    cursor:not-allowed;

}


/* =====================================================
   EXAMPLE BUTTONS
===================================================== */

.examples{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:9px;

    margin-top:15px;

}


.example{

    border:
    1px solid
    rgba(255,255,255,.1);

    background:
    rgba(255,255,255,.04);

    color:#a9bbb4;

    padding:
    8px 15px;

    border-radius:30px;

    cursor:pointer;

    transition:.2s;

}


.example:hover{

    background:
    rgba(255,255,255,.1);

    color:white;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    text-align:center;

    margin:45px 0;

    color:#9fb5ac;

}


.spinner{

    width:40px;

    height:40px;

    margin:
    0 auto 14px;

    border:
    3px solid
    rgba(255,255,255,.1);

    border-top-color:
    #aee4bd;

    border-radius:50%;

    animation:
    spin .8s linear infinite;

}


@keyframes spin{

    to{

        transform:
        rotate(360deg);

    }

}


.hidden{

    display:none;

}


/* =====================================================
   RESULTS HEADER
===================================================== */

.results{

    margin-top:55px;

}


.results-head{

    display:flex;

    justify-content:
    space-between;

    align-items:end;

    gap:20px;

    margin-bottom:25px;

}


.label{

    color:#d9c27b;

    font-size:11px;

    letter-spacing:2px;

    margin-bottom:7px;

}


.results-head h2{

    font-size:32px;

}


/* =====================================================
   QARI
===================================================== */

.qari{

    width:280px;

}


.qari label{

    display:block;

    color:#8fa69c;

    font-size:12px;

    margin-bottom:7px;

}


select{

    width:100%;

    padding:13px;

    border-radius:12px;

    border:
    1px solid
    rgba(255,255,255,.12);

    outline:none;

    background:#102a23;

    color:white;

    cursor:pointer;

}


/* =====================================================
   AYAH CARD
===================================================== */

.ayah{

    position:relative;

    padding:29px;

    margin-bottom:22px;

    border-radius:24px;

    background:
    rgba(255,255,255,.055);

    border:
    1px solid
    rgba(255,255,255,.1);

    box-shadow:
    0 15px 50px
    rgba(0,0,0,.15);

    overflow:hidden;

    animation:
    cardIn .5s ease;

}


@keyframes cardIn{

    from{

        opacity:0;

        transform:
        translateY(15px);

    }

    to{

        opacity:1;

        transform:
        translateY(0);

    }

}


.ayah::before{

    content:"";

    position:absolute;

    left:0;

    top:0;

    width:4px;

    height:100%;

    background:#82c997;

}


.number{

    width:40px;

    height:40px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:
    rgba(150,220,170,.1);

    color:#aee4bd;

    margin-bottom:18px;

    font-weight:bold;

}


/* =====================================================
   ARABIC
===================================================== */

.arabic{

    direction:rtl;

    text-align:right;

    font-family:
    "Times New Roman",
    serif;

    font-size:40px;

    line-height:2.1;

    margin-bottom:25px;

}


/* =====================================================
   URDU
===================================================== */

.translation{

    padding:18px;

    border-radius:16px;

    background:
    rgba(255,255,255,.035);

    border:
    1px solid
    rgba(255,255,255,.06);

}


.translation-title{

    color:#d8c27e;

    font-size:11px;

    font-weight:bold;

    letter-spacing:1.5px;

    margin-bottom:10px;

}


.urdu{

    direction:rtl;

    text-align:right;

    font-size:21px;

    line-height:2;

    color:#e1ebe6;

}


/* =====================================================
   REFERENCE
===================================================== */

.reference{

    margin:
    17px 0;

    color:#d8c27e;

    font-size:13px;

}


/* =====================================================
   AUDIO
===================================================== */

.audio{

    padding-top:18px;

    border-top:
    1px solid
    rgba(255,255,255,.08);

}


.audio-top{

    display:flex;

    align-items:center;

    gap:13px;

}


.play{

    width:50px;

    height:50px;

    border:none;

    border-radius:50%;

    background:#b9e6c5;

    color:#092017;

    font-size:18px;

    cursor:pointer;

    transition:.2s;

}


.play:hover{

    transform:
    scale(1.06);

}


.audio-info strong{

    display:block;

    font-size:14px;

}


.audio-info small{

    color:#81968e;

}


audio{

    width:100%;

    margin-top:13px;

}


.status{

    margin-top:7px;

    font-size:12px;

    color:#82988f;

}


/* =====================================================
   ERROR
===================================================== */

.error{

    color:#ffb5b5;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

    body{

        padding:
        15px 10px;

    }


    h1{

        font-size:41px;

    }


    .bismillah{

        font-size:24px;

    }


    .results-head{

        flex-direction:column;

        align-items:stretch;

    }


    .qari{

        width:100%;

    }


    .ayah{

        padding:21px;

    }


    .arabic{

        font-size:30px;

    }


    .urdu{

        font-size:18px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">


    <div class="moon">
        ☾
    </div>


    <div class="bismillah">

        بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ

    </div>


    <h1>

        Find Your
        <span>Ayah</span>

    </h1>


    <p>

        Apne dil ki baat likhein aur Quran ki
        relevant ayat discover karein.

    </p>


</section>


<!-- =====================================================
     SEARCH
===================================================== -->

<section class="search-box">


<textarea
id="prompt"
placeholder="Example: Mujhe sabr ke bare mein ayat chahiye..."
></textarea>


<button id="searchBtn">

     Find Quranic Guidance

</button>


<div class="examples">


<button class="example">
    Sabr
</button>


<button class="example">
    Allah par bharosa
</button>


<button class="example">
    Rehmat
</button>


<button class="example">
    Maafi
</button>


<button class="example">
    Sukoon
</button>


</div>


</section>


<!-- =====================================================
     LOADING
===================================================== -->

<div
id="loading"
class="loading hidden"
>

    <div class="spinner"></div>

    Quran se relevant ayat search ho rahi hai...

</div>


<!-- =====================================================
     RESULTS
===================================================== -->

<section
id="results"
class="results hidden"
>


<div class="results-head">


<div>

    <div class="label">

        QURANIC GUIDANCE

    </div>


    <h2>

        Ayat for you

    </h2>

</div>


<!-- QARI SELECT -->

<div class="qari">


<label>

    🎙️ Choose Qari

</label>


<select id="reciter">


<option value="ar.alafasy">

    Mishary Rashid Alafasy

</option>


<option value="ar.husary">

    Mahmoud Khalil Al-Husary

</option>


<option value="ar.minshawi">

    Mohamed Siddiq Al-Minshawi

</option>


</select>


</div>


</div>


<div id="cards"></div>


</section>


</div>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const promptBox =
document.getElementById("prompt");


const searchBtn =
document.getElementById("searchBtn");


const loading =
document.getElementById("loading");


const results =
document.getElementById("results");


const cards =
document.getElementById("cards");


const reciter =
document.getElementById("reciter");


/* =====================================================
   SMART TOPIC MAP
===================================================== */

const TOPICS = {

    "sabr":
    "patience",

    "sabar":
    "patience",

    "patience":
    "patience",

    "mushkil":
    "patience",

    "problem":
    "patience",

    "pareshan":
    "patience",

    "tension":
    "patience",


    "rehmat":
    "mercy",

    "rahmat":
    "mercy",

    "mercy":
    "mercy",


    "maafi":
    "forgiveness",

    "maaf":
    "forgiveness",

    "forgive":
    "forgiveness",

    "forgiveness":
    "forgiveness",


    "sukoon":
    "peace",

    "peace":
    "peace",

    "udaasi":
    "peace",

    "sad":
    "peace",


    "bharosa":
    "trust",

    "tawakkul":
    "trust",

    "trust":
    "trust",

    "allah par bharosa":
    "trust"

};


/* =====================================================
   EXAMPLES
===================================================== */

document
.querySelectorAll(".example")
.forEach(button=>{

    button.onclick=()=>{

        promptBox.value =
        button.textContent.trim();

        promptBox.focus();

    };

});


/* =====================================================
   SEARCH
===================================================== */

searchBtn.onclick =
searchQuran;


/* =====================================================
   ENTER
===================================================== */

promptBox.addEventListener(
"keydown",
event=>{

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        searchQuran();

    }

});


/* =====================================================
   SMART SEARCH
===================================================== */

async function searchQuran(){

    let query =
    promptBox.value
    .trim()
    .toLowerCase();


    if(!query){

        alert(
            "Pehle apni feeling ya topic likhein"
        );

        return;

    }


    loading.classList.remove(
        "hidden"
    );


    results.classList.add(
        "hidden"
    );


    cards.innerHTML="";


    searchBtn.disabled=true;

    searchBtn.textContent=
    "Searching...";


    /*
       User ke sentence se
       known topic identify karna
    */

    for(
        const key in TOPICS
    ){

        if(
            query.includes(key)
        ){

            query =
            TOPICS[key];

            break;

        }

    }


    try{


        /* =============================================
           QURAN.COM SEARCH API
        ============================================= */

        const url =
        "https://api.quran.com/api/v4/search"
        +
        "?q="
        +
        encodeURIComponent(query)
        +
        "&size=5"
        +
        "&page=1"
        +
        "&language=en";


        const response =
        await fetch(url);


        if(!response.ok){

            throw new Error(
                "Search failed"
            );

        }


        const data =
        await response.json();


        const found =
        data.search?.results || [];


        if(!found.length){

            cards.innerHTML=`

                <div class="ayah">

                    <h3>
                        Ayat nahi mili
                    </h3>

                    <br>

                    Dusra topic try karein,
                    jaise <b>Sabr</b>,
                    <b>Rehmat</b> ya
                    <b>Maafi</b>.

                </div>

            `;

        }

        else{


            /* =========================================
               CREATE EACH AYAH
            ========================================= */

            for(
                let i=0;
                i<found.length;
                i++
            ){

                await createAyahCard(
                    found[i],
                    i
                );

            }

        }


        results.classList.remove(
            "hidden"
        );


    }

    catch(error){

        cards.innerHTML=`

            <div class="ayah error">

                <h3>
                    Connection problem
                </h3>

                <br>

                Internet connection check
                karein aur dobara try karein.

            </div>

        `;


        results.classList.remove(
            "hidden"
        );

    }


    loading.classList.add(
        "hidden"
    );


    searchBtn.disabled=false;

    searchBtn.textContent=
    "✨ Find Quranic Guidance";

}


/* =====================================================
   CREATE AYAH CARD
===================================================== */

async function createAyahCard(
    result,
    index
){

    const verseKey =
    result.verse_key;


    /* =============================================
       GET ARABIC AYAH
    ============================================= */

    const response =
    await fetch(

        "https://api.alquran.cloud/v1/ayah/"
        +
        verseKey

    );


    if(!response.ok){

        return;

    }


    const data =
    await response.json();


    const ayah =
    data.data;


    if(!ayah){

        return;

    }


    /* =============================================
       URDU TRANSLATION
    ============================================= */

    let urdu =
    "Urdu translation unavailable.";


    if(
        result.translations &&
        result.translations.length
    ){

        urdu =
        cleanHTML(
            result.translations[0].text
        );

    }


    /* =============================================
       CARD
    ============================================= */

    const card =
    document.createElement("div");


    card.className=
    "ayah";


    card.innerHTML=`

        <div class="number">

            ${index+1}

        </div>


        <div class="arabic">

            ${safe(ayah.text)}

        </div>


        <div class="translation">


            <div class="translation-title">

                🇵🇰 URDU TARJUMA

            </div>


            <div class="urdu">

                ${safe(urdu)}

            </div>


        </div>


        <div class="reference">

            📖 Surah / Ayah:
            ${safe(verseKey)}

        </div>


        <div class="audio">


            <div class="audio-top">


                <button class="play">

                    ▶

                </button>


                <div class="audio-info">

                    <strong>

                        Quran Recitation

                    </strong>


                    <small>

                        Selected Qari

                    </small>

                </div>


            </div>


            <audio
                controls
                preload="none"
            ></audio>


            <div class="status"></div>


        </div>

    `;


    /* =============================================
       AUDIO
    ============================================= */

    const playButton =
    card.querySelector(".play");


    const audio =
    card.querySelector("audio");


    const status =
    card.querySelector(".status");


    playButton.onclick=()=>{


        const qari =
        reciter.value;


        /*
           Islamic Network audio
        */

        audio.src =
        `https://cdn.islamic.network/quran/audio/128/${qari}/${ayah.number}.mp3`;


        audio.play()

        .then(()=>{

            playButton.textContent=
            "⏸";

            status.textContent=
            "🔊 Recitation playing...";

        })

        .catch(()=>{

            status.textContent=
            "Audio play nahi ho saka.";

        });

    };


    audio.onpause=()=>{

        if(!audio.ended){

            playButton.textContent=
            "▶";

            status.textContent=
            "Paused";

        }

    };


    audio.onended=()=>{

        playButton.textContent=
        "▶";

        status.textContent=
        "Finished ✓";

    };


    audio.onerror=()=>{

        playButton.textContent=
        "▶";

        status.textContent=
        "Audio unavailable.";

    };


    cards.appendChild(card);

}


/* =====================================================
   REMOVE HTML
===================================================== */

function cleanHTML(text){

    const div =
    document.createElement("div");


    div.innerHTML =
    text;


    return(
        div.textContent ||
        div.innerText ||
        ""
    );

}


/* =====================================================
   SECURITY
===================================================== */

function safe(text){

    return String(text)

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}

</script>

</body>
</html>
