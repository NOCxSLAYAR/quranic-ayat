<!DOCTYPE html>
<html lang="en">

<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ayah Noor - Quranic Guidance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #061611;
            --card: rgba(255, 255, 255, .055);
            --border: rgba(255, 255, 255, .11);
            --text: #f4faf6;
            --muted: #95aaa2;
            --green: #a9dfb8;
            --green-dark: #6fbe88;
            --gold: #d9c47d;
        }

        body {
            min-height: 100vh;
            padding: 20px 14px;

            font-family: Arial, Helvetica, sans-serif;

            color: var(--text);

            background:
                radial-gradient(circle at 10% 0%,
                    rgba(72, 150, 105, .20),
                    transparent 32%),
                radial-gradient(circle at 90% 100%,
                    rgba(201, 174, 84, .10),
                    transparent 30%),
                var(--bg);
        }

        .container {
            width: min(980px, 95%);
            margin: auto;
        }


        /* =========================================
   PAGE LOADER
========================================= */

        #pageLoader {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--bg);

            transition:
                opacity .6s ease,
                visibility .6s ease;
        }

        #pageLoader.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loaderContent {
            width: 260px;
            text-align: center;
        }

        .loaderSpinner {
            width: 44px;
            height: 44px;

            margin: 0 auto 20px;

            border: 3px solid rgba(255, 255, 255, .10);

            border-top-color: var(--green);

            border-radius: 50%;

            animation: spin .8s linear infinite;
        }

        .loaderContent h2 {
            font-size: 27px;
            margin-bottom: 7px;
        }

        .loaderContent p {
            color: var(--green);
            font-size: 14px;
        }

        .loaderLine {
            width: 180px;
            height: 4px;

            overflow: hidden;

            margin: 18px auto 0;

            border-radius: 10px;

            background: rgba(255, 255, 255, .09);
        }

        .loaderLine span {
            display: block;

            width: 40%;
            height: 100%;

            background: var(--green);

            animation: lineMove 1.2s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes lineMove {

            0% {
                transform: translateX(-130%);
            }

            100% {
                transform: translateX(380%);
            }

        }


        /* =========================================
   HERO
========================================= */

        .hero {
            text-align: center;

            padding:
                35px 0 40px;
        }

        .heroTitleSmall {
            color: var(--gold);

            font-size: 11px;

            letter-spacing: 3px;

            margin-bottom: 18px;
        }

        .bismillah {
            direction: rtl;
            text-align: center;

            font-family: "Times New Roman", serif;

            color: var(--green);

            font-size: 29px;

            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: clamp(44px, 8vw, 72px);

            line-height: 1;

            letter-spacing: -2px;

            margin-bottom: 18px;
        }

        .hero h1 span {
            color: var(--green);
        }

        .heroText {
            max-width: 700px;

            margin: auto;

            color: var(--muted);

            line-height: 1.8;

            font-size: 15px;
        }


        /* =========================================
   SEARCH
========================================= */

        .searchBox {
            padding: 13px;

            border-radius: 24px;

            background: var(--card);

            border:
                1px solid var(--border);

            backdrop-filter: blur(15px);
        }

        textarea {
            width: 100%;
            height: 125px;

            resize: none;

            border: 0;
            outline: 0;

            background: transparent;

            color: white;

            padding: 18px;

            font-family: inherit;

            font-size: 17px;

            line-height: 1.6;
        }

        textarea::placeholder {
            color: #6f857b;
        }

        #searchBtn {
            width: 100%;

            padding: 16px;

            border: 0;

            border-radius: 15px;

            background:
                linear-gradient(135deg,
                    #c6ebcf,
                    #70c58c);

            color: #071b11;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: .2s;
        }

        #searchBtn:hover {
            transform: translateY(-2px);
        }

        #searchBtn:disabled {
            opacity: .6;
            cursor: wait;
        }


        /* =========================================
   EXAMPLES
========================================= */

        .examples {
            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 8px;

            margin-top: 14px;
        }

        .example {
            padding: 8px 14px;

            border-radius: 30px;

            border:
                1px solid var(--border);

            background:
                rgba(255, 255, 255, .035);

            color: #a3b5ad;

            font-size: 12px;

            cursor: pointer;
        }


        /* =========================================
   SEARCH LOADER
========================================= */

        #searchLoading {
            display: none;

            text-align: center;

            margin: 40px 0;

            color: var(--muted);
        }

        .searchSpinner {
            width: 38px;
            height: 38px;

            margin: 0 auto 14px;

            border-radius: 50%;

            border:
                3px solid rgba(255, 255, 255, .10);

            border-top-color:
                var(--green);

            animation:
                spin .8s linear infinite;
        }


        /* =========================================
   RESULTS
========================================= */

        .results {
            margin-top: 55px;
        }

        .resultsHeader {
            display: flex;

            justify-content: space-between;

            align-items: end;

            gap: 24px;

            margin-bottom: 25px;
        }

        .resultLabel {
            color: var(--gold);

            font-size: 11px;

            letter-spacing: 2px;

            margin-bottom: 8px;
        }

        .resultsHeader h2 {
            font-size: 32px;
        }

        .resultInfo {
            margin-top: 7px;

            color: var(--muted);

            font-size: 12px;
        }


        /* =========================================
   QARI
========================================= */

        .qariBox {
            width: 280px;
        }

        .qariBox label {
            display: block;

            color: var(--muted);

            font-size: 12px;

            margin-bottom: 7px;
        }

        select {
            width: 100%;

            padding: 13px 14px;

            border-radius: 12px;

            border:
                1px solid var(--border);

            background: #102a23;

            color: white;

            outline: 0;
        }


        /* =========================================
   ONE COMPLETE AYAH = ONE CARD
========================================= */

        .ayahCard {
            position: relative;

            padding: 30px;

            margin-bottom: 20px;

            border-radius: 24px;

            background: var(--card);

            border:
                1px solid var(--border);

            overflow: hidden;

            animation:
                cardShow .45s ease both;
        }

        @keyframes cardShow {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .ayahCard::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 4px;
            height: 100%;

            background: var(--green-dark);
        }

        .ayahNumber {
            width: 38px;
            height: 38px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                rgba(169, 223, 184, .10);

            color: var(--green);

            font-weight: bold;

            font-size: 13px;

            margin-bottom: 20px;
        }


        /* =========================================
   COMPLETE ARABIC AYAH
========================================= */

        .arabic {
            direction: rtl;

            unicode-bidi: plaintext;

            text-align: right;

            font-family:
                "Times New Roman",
                serif;

            font-size:
                clamp(30px, 5vw, 43px);

            line-height: 2.15;

            margin-bottom: 25px;

            /*
       Important:
       entire verse stays in one element.
    */

            display: block;

            width: 100%;
        }


        /* =========================================
   URDU
========================================= */

        .translationBox {
            padding: 20px;

            border-radius: 16px;

            background:
                rgba(255, 255, 255, .035);

            border:
                1px solid rgba(255, 255, 255, .06);

            margin-bottom: 15px;
        }

        .translationTitle {
            direction: rtl;

            text-align: right;

            color: var(--gold);

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 12px;
        }

        .urdu {
            direction: rtl !important;

            unicode-bidi: plaintext;

            text-align: right !important;

            font-family:
                "Noto Nastaliq Urdu",
                "Jameel Noori Nastaleeq",
                "Noto Sans Arabic",
                Arial,
                sans-serif;

            font-size: 20px;

            line-height: 2.3;

            color: #edf4ef;

            display: block;

            width: 100%;
        }


        /* =========================================
   REFERENCE
========================================= */

        .reference {
            margin:
                17px 0;

            color: var(--gold);

            font-size: 13px;
        }


        /* =========================================
   AUDIO
========================================= */

        .audioBox {
            padding-top: 18px;

            border-top:
                1px solid rgba(255, 255, 255, .08);
        }

        .audioTop {
            display: flex;

            align-items: center;

            gap: 13px;

            margin-bottom: 12px;
        }

        .playButton {
            min-width: 74px;

            height: 44px;

            border: 0;

            border-radius: 11px;

            background: var(--green);

            color: #092017;

            cursor: pointer;

            font-size: 13px;

            font-weight: bold;
        }

        .audioText strong {
            display: block;

            font-size: 13px;

            margin-bottom: 4px;
        }

        .audioText small {
            color: #80958c;
        }

        .audioPlayer {
            width: 100%;

            margin-top: 5px;
        }

        .audioStatus {
            min-height: 18px;

            margin-top: 7px;

            color: #82978f;

            font-size: 12px;
        }


        /* =========================================
   MESSAGE
========================================= */

        .messageCard {
            padding: 25px;

            border-radius: 20px;

            background: var(--card);

            border:
                1px solid var(--border);

            color: var(--muted);

            line-height: 1.8;
        }

        .error {
            color: #ffb4b4;
        }


        /* =========================================
   MOBILE
========================================= */

        @media(max-width:650px) {

            body {
                padding:
                    14px 9px;
            }

            .bismillah {
                font-size: 24px;
            }

            .hero h1 {
                font-size: 42px;
            }

                flex-direction: column;

                align-items: stretch;
            }

            .qariBox {
                width: 100%;
            }

            .ayahCard {
                padding: 21px;
            }

            .arabic {
                font-size: 30px;
                line-height: 2;
            }

            .urdu {
                font-size: 18px;
            }

        }
    </style>

</head>

                button => {

                    );

        /* =========================================
           NORMALIZE TEXT
        ========================================= */

        function normalizeText(text) {

            return text
                .toLowerCase()
                .replace(/[.,!?'"`]/g, " ")
                .replace(/\s+/g, " ")
                .trim();

        }


        /* =========================================
           DETECT TOPICS
        ========================================= */

        function detectTopics(text) {

            const query =
                normalizeText(text);

            const foundTopics = [];


            /*
               Longer phrases first.
            */

            const topicEntries =
                Object.entries(TOPICS)
                    .map(
                        ([name, data]) => ({
                            name,
                            data
                        })
                    );


            for (
                const entry of topicEntries
            ) {

                for (
                    const keyword of entry.data.keywords
                ) {

                    if (
                        query.includes(
                            normalizeText(keyword)
                        )
                    ) {

                        if (
                            !foundTopics.includes(
                                entry.name
                            )
                        ) {

                            foundTopics.push(
                                entry.name
                            );

                        }

                        break;

                    }

                }

            }


            return foundTopics;

        }


        /* =========================================
           UNIQUE VERSES
        
           IMPORTANT:
           SAME AYAH CAN NEVER APPEAR TWICE.
        ========================================= */

        function uniqueVerseKeys(
            verseKeys
        ) {

            const seen =
                new Set();

            const unique = [];


            for (
                const key of verseKeys
            ) {

                if (
                    !key ||
                    seen.has(key)
                ) {

                    continue;

                }


                seen.add(key);

                unique.push(key);

            }


            return unique;

        }


        /* =========================================
           COLLECT CURATED VERSES
        ========================================= */

        function collectCuratedVerses(
            detectedTopics
        ) {

            const combined = [];


            /*
               Important:
               We add verse KEYS only.
        
               We do NOT add search snippets.
               Therefore one key = one complete ayah.
            */

            for (
                const topicName of detectedTopics
            ) {

                const topic =
                    TOPICS[topicName];


                topic.verses.forEach(
                    key => {

                        combined.push(
                            key
                        );

                    }
                );

            }


            return uniqueVerseKeys(
                combined
            ).slice(
                0,
                10
            );

        }


        /* =========================================
           SEARCH
        ========================================= */

        searchButton.addEventListener(
            "click",
            searchQuran
        );


        promptInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    searchQuran();

                }

            }
        );


        /* =========================================
           MAIN SEARCH
        ========================================= */

        async function searchQuran() {

            // const userPrompt = promptInput.value.trim();

            const user_pr = promptInput.value.trim();

            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer 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"
                },
                body: JSON.stringify({
                    model: "openai/gpt-4o-mini",
                    messages: [
                        {
                            role: "system",
                            content: `You are a language detector and translator.

If the user's input is in Urdu, translate it into English.
If the user's input is Roman Urdu, translate it into English.
If the user's input is already English, return it exactly as it is.
Return ONLY the final text. Do not add explanations.`
                        },
                        {
                            role: "user",
                            content: user_pr
                        }
                    ]
                })
            });

            const data = await response.json();

            const userPrompt = data.choices[0].message.content.trim();



            if (!userPrompt) {

                alert(
                    "Please write your topic first."
                );

                return;

            }


            /*
               Search loader ONLY starts
               after user presses Search.
            */

            searchLoading.style.display =
                "block";


            results.style.display =
                "none";


            cards.innerHTML =
                "";


            resultInfo.textContent =
                "";


            searchButton.disabled =
                true;


            searchButton.textContent =
                "Searching...";


            try {

                const detectedTopics =
                    detectTopics(
                        userPrompt
                    );


                let verseKeys = [];


                /*
                   Known topics:
                   use curated complete verses.
                */

                if (
                    detectedTopics.length > 0
                ) {

                    verseKeys =
                        collectCuratedVerses(
                            detectedTopics
                        );


                    resultInfo.textContent =
                        detectedTopics
                            .map(
                                topic =>
                                    topic
                                        .charAt(0)
                                        .toUpperCase()
                                    +
                                    topic.slice(1)
                            )
                            .join(" and ");

                }


                /*
                   Unknown topic:
                   API fallback.
                */

                else {

                    verseKeys =
                        await fallbackSearch(
                            userPrompt
                        );


                    resultInfo.textContent =
                        "Search results";

                }


                /*
                   Final duplicate protection.
                */

                verseKeys =
                    uniqueVerseKeys(
                        verseKeys
                    ).slice(
                        0,
                        10
                    );


                if (
                    verseKeys.length === 0
                ) {

                    cards.innerHTML = `

                <div class="messageCard">

                    No closely related ayah was found.
                    Please try another topic.

                </div>

            `;

                }
                else {

                    /*
                       ONE KEY AT A TIME
                       = ONE COMPLETE AYAH CARD
                    */

                    for (
                        let i = 0;
                        i < verseKeys.length;
                        i++
                    ) {

                        await createAyahCard(
                            verseKeys[i],
                            i
                        );

                    }

                }


                results.style.display =
                    "block";

            }

            catch {

                cards.innerHTML = `

            <div class="messageCard error">

                Quran could not be loaded right now.
                Please try again.

            </div>

        `;


                results.style.display =
                    "block";

            }

            finally {

                searchLoading.style.display =
                    "none";


                searchButton.disabled =
                    false;


                searchButton.textContent =
                    "Find Quranic Guidance";

            }

        }


        /* =========================================
           API FALLBACK
        ========================================= */

        async function fallbackSearch(
            query
        ) {

            const url =
                "https://api.alquran.cloud/v1/search/"
                +
                encodeURIComponent(query)
                +
                "/all/en";


            const response =
                await fetch(url);


            if (!response.ok) {

                return [];

            }


            const data =
                await response.json();


            const matches =
                data.data?.matches || [];


            const keys = [];


            for (
                const match of matches
            ) {

                /*
                   Convert every API result
                   into a verse key.
        
                   Never display match.text directly.
                */

                const key =
                    match.verseKey ||
                    match.verse?.verseKey ||
                    (
                        match.surah
                            ? `${match.surah.number}:${match.numberInSurah}`
                            : null
                    );


                if (key) {

                    keys.push(
                        key
                    );

                }

            }


            return uniqueVerseKeys(
                keys
            ).slice(
                0,
                10
            );

        }


        /* =========================================
           CREATE ONE COMPLETE AYAH
        ========================================= */

        async function createAyahCard(
            verseKey,
            index
        ) {

            /*
               Exact ayah endpoint.
        
               Example:
               13:28
        
               Returns the COMPLETE verse,
               not a search snippet.
            */

            const url =
                "https://api.alquran.cloud/v1/ayah/"
                +
                encodeURIComponent(
                    verseKey
                )
                +
                "/editions/"
                +
                "quran-uthmani,ur.jalandhry";


            const response =
                await fetch(
                    url
                );


            if (!response.ok) {

                return;

            }


            const data =
                await response.json();


            const editions =
                data.data || [];


            let arabic =
                "";

            let urdu =
                "";

            let globalNumber =
                null;


            for (
                const edition of editions
            ) {

                if (
                    edition.edition?.identifier ===
                    "quran-uthmani"
                ) {

                    arabic =
                        edition.text;

                    globalNumber =
                        edition.number;

                }


                if (
                    edition.edition?.identifier ===
                    "ur.jalandhry"
                ) {

                    urdu =
                        edition.text;

                }

            }


            /*
               Do not render incomplete data.
            */

            if (
                !arabic ||
                !urdu ||
                !globalNumber
            ) {

                return;

            }


            const arabicEdition =
                editions.find(
                    item =>
                        item.edition?.identifier ===
                        "quran-uthmani"
                );


            const surahName =
                arabicEdition
                    ?.surah
                    ?.englishName
                ||
                arabicEdition
                    ?.surah
                    ?.name
                ||
                "";


            /*
               Create exactly ONE card.
            */

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "ayahCard";


            card.style.animationDelay =
                `${index * 0.05}s`;


            card.innerHTML = `

        <div class="ayahNumber">
            ${index + 1}
        </div>


        <!-- COMPLETE ARABIC AYAH -->

        <div
            class="arabic"
            lang="ar"
            dir="rtl"
        >
            ${escapeHTML(arabic)}
        </div>


        <!-- COMPLETE URDU TRANSLATION -->

        <div class="translationBox">

            <div
                class="translationTitle"
                lang="ur"
                dir="rtl"
            >

                اردو ترجمہ — فتح محمد جالندھری

            </div>


            <div
                class="urdu"
                lang="ur"
                dir="rtl"
            >

                ${escapeHTML(urdu)}

            </div>

        </div>


        <!-- REFERENCE -->

        <div class="reference">

            ${escapeHTML(surahName)}

            ${surahName ? " - " : ""}

            Ayah ${escapeHTML(verseKey)}

        </div>


        <!-- AUDIO -->

        <div class="audioBox">

            <div class="audioTop">

                <button
                    class="playButton"
                    type="button"
                >
                    Play
                </button>


                <div class="audioText">

                    <strong>
                        Quran Recitation
                    </strong>

                    <small>
                        Selected Qari
                    </small>

                </div>

            </div>


            <audio
                class="audioPlayer"
                controls
                preload="none"
            ></audio>


            <div class="audioStatus">
                Ready to play
            </div>

        </div>

    `;


            /* =========================================
               AUDIO
            ========================================= */

            const playButton =
                card.querySelector(
                    ".playButton"
                );


            const audio =
                card.querySelector(
                    ".audioPlayer"
                );


            const audioStatus =
                card.querySelector(
                    ".audioStatus"
                );


            let loadedQari =
                "";


            async function loadAudio() {

                const selectedQari =
                    reciter.value;


                /*
                   Get audio source from API.
                */

                const audioURL =
                    "https://api.alquran.cloud/v1/ayah/"
                    +
                    globalNumber
                    +
                    "/"
                    +
                    selectedQari;


                const audioResponse =
                    await fetch(
                        audioURL
                    );


                if (!audioResponse.ok) {

                    throw new Error();

                }


                const audioData =
                    await audioResponse.json();


                const source =
                    audioData.data?.audio;


                if (!source) {

                    throw new Error();

                }


                audio.src =
                    source;


                audio.load();


                loadedQari =
                    selectedQari;

            }


            /* =========================================
               PLAY / PAUSE
            ========================================= */

            playButton.addEventListener(
                "click",
                async function () {

                    try {

                        /*
                           If Qari changed,
                           load again.
                        */

                        if (
                            loadedQari !==
                            reciter.value
                        ) {

                            audioStatus.textContent =
                                "Loading recitation...";

                            await loadAudio();

                        }


                        if (
                            audio.paused
                        ) {

                            await audio.play();

                        }
                        else {

                            audio.pause();

                        }

                    }

                    catch {

                        playButton.textContent =
                            "Play";

                        audioStatus.textContent =
                            "This recitation is unavailable.";

                    }

                }
            );


            /* =========================================
               AUDIO EVENTS
            ========================================= */

            audio.addEventListener(
                "play",
                function () {

                    playButton.textContent =
                        "Pause";

                    audioStatus.textContent =
                        "Playing";

                }
            );


            audio.addEventListener(
                "pause",
                function () {

                    if (
                        !audio.ended
                    ) {

                        playButton.textContent =
                            "Play";

                        audioStatus.textContent =
                            "Paused";

                    }

                }
            );


            audio.addEventListener(
                "ended",
                function () {

                    playButton.textContent =
                        "Play";

                    audioStatus.textContent =
                        "Finished";

                }
            );


            audio.addEventListener(
                "error",
                function () {

                    playButton.textContent =
                        "Play";

                    audioStatus.textContent =
                        "This recitation is unavailable.";

                }
            );


            /*
               Append exactly one card.
            */

            cards.appendChild(
                card
            );

        }


        /* =========================================
           QARI CHANGE
        ========================================= */

        reciter.addEventListener(
            "change",
            function () {

                document
                    .querySelectorAll(
                        ".ayahCard"
                    )
                    .forEach(
                        card => {

                            const audio =
                                card.querySelector(
                                    ".audioPlayer"
                                );

                            const button =
                                card.querySelector(
                                    ".playButton"
                                );

                            const status =
                                card.querySelector(
                                    ".audioStatus"
                                );


                            audio.pause();

                            audio.currentTime =
                                0;

                            audio.removeAttribute(
                                "src"
                            );

                            audio.load();


                            button.textContent =
                                "Play";


                            status.textContent =
                                "New Qari selected";

                        }
                    );

            }
        );


        /* =========================================
           ESCAPE TEXT
        ========================================= */

        function escapeHTML(text) {

            return String(text)

                .replaceAll(
                    "&",
                    "&amp;"
                )

                .replaceAll(
                    "<",
                    "&lt;"
                )

                .replaceAll(
                    ">",
                    "&gt;"
                )

                .replaceAll(
                    '"',
                    "&quot;"
                )

                .replaceAll(
                    "'",
                    "&#039;"
                );

        }

    </script>
</body>
